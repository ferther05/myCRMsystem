server:
  address: ${CRM_SERVER_ADDRESS:127.0.0.1}
  port: ${CRM_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: crm-backend
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CRM_DB_URL:jdbc:mysql://127.0.0.1:3306/crm_system?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000}
    username: ${CRM_DB_USERNAME:crm_app}
    password: ${CRM_DB_PASSWORD:}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  data:
    redis:
      host: ${CRM_REDIS_HOST:127.0.0.1}
      port: ${CRM_REDIS_PORT:6380}
      database: ${CRM_REDIS_DATABASE:0}
      password: ${CRM_REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: auto

crm:
  security:
    jwt:
      secret: ${CRM_JWT_SECRET:}
      issuer: crm-backend
      ttl-seconds: ${CRM_JWT_TTL_SECONDS:7200}

logging:
  file:
    name: ${CRM_LOG_FILE:../output/backend/crm-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    com.bishe.crm: INFO
